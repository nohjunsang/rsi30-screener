name: Refresh Universe Cache

# 하루 1회, 미국 장 열리기 전에 유니버스(S&P500+400+600) + 시가총액 +
# 섹터별 top N 캐시를 갱신. 이 캐시가 있어야 EOD/장중 스크리너가
# 매번 1000개 넘는 종목 시총을 새로 조회하지 않고 빠르게 동작함.
on:
  schedule:
    - cron: '0 11 * * 1-5'   # 평일 UTC 11:00 (한국시간 20:00, 미국장 시작 전)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 캐시 갱신
        run: python refresh_cache.py

      - name: 캐시 파일 저장소에 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add universe_cache.json
          git diff --staged --quiet || git commit -m "chore: refresh universe cache [skip ci]"
          git push
