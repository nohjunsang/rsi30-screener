name: Intraday 4H Signal Monitor

# 미국 프리마켓~애프터마켓 시간(04:00~20:00 ET, 정규장 포함)을 UTC로
# 환산해 커버. 자정을 안 걸치는 EDT(서머타임) 기준 하루 범위와,
# 자정을 걸치는 EST 기준 범위를 각각 별도 cron으로 잡음.
#   EDT: 04:00~20:00 ET = 08:00~24:00 UTC (당일)
#   EST: 04:00~20:00 ET = 09:00~01:00 UTC (다음날 새벽까지 걸침)
# -> 08:00~23:59 UTC(당일 평일) + 00:00~01:xx UTC(다음날, 요일은 하루
#    밀려서 화~토) 이렇게 두 구간으로 나눠서 두 계절 다 커버함.
# (실제 감시 시간대인지 최종 판단은 intraday_monitor.py 내부의 zoneinfo
#  체크가 다시 한 번 정확하게 걸러줌)
#
# 4시간봉 기준이라 15분보다 여유있게 30분 간격으로 체크.
on:
  schedule:
    - cron: '7,37 8-23 * * 1-5'   # 평일 08:07~23:37 UTC (정각/30분 혼잡 회피)
    - cron: '7,37 0-1 * * 2-6'    # (EST 대비) 익일 00:07~01:37 UTC, UTC요일 화~토
  workflow_dispatch:
    inputs:
      test:
        description: '테스트 모드 (시간대+상태 무시, 지금 조건 충족 신호 강제 전송, 저장 안 함)'
        type: boolean
        default: false

permissions:
  contents: write   # 상태파일/히스토리 커밋을 위해 필요

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 4H 모니터링 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python intraday_monitor.py ${{ github.event.inputs.test == 'true' && '--test' || '' }}

      - name: 상태파일/히스토리 저장소에 반영
        if: ${{ github.event.inputs.test != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in h4_state.json alert_history.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "chore: update h4 state/history [skip ci]"
          git push
