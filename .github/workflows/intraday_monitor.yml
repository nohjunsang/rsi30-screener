name: Intraday RSI Monitor

on:
  schedule:
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 장중 모니터링 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python intraday_monitor.py

      - name: 상태파일(중복방지용) 저장소에 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f alerted_today.json ]; then
            git add alerted_today.json
            git diff --staged --quiet || git commit -m "chore: update alerted_today.json [skip ci]"
            git push
          else
            echo "alerted_today.json 없음 - 커밋 스킵"
          fi