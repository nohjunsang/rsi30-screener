name: EOD Signal Report

# 미국 정규장 마감(16:00 ET) 이후 최대한 놓치지 않고 실행되도록, 넉넉한
# 범위를 자주(5분 간격, 혼잡시간 회피) 깨워서 체크함. 실제로 "마감 이후
# 300분(5시간) 이내"인지는 main.py 내부의 zoneinfo 체크가 정확하게 걸러주고,
# 하루 1번만 실행되도록 eod_sent.json으로 중복도 방지함 (그래서 아래
# 범위 안에서 여러 번 깨어나도 실제로는 그날의 첫 실행 때만 동작함).
#
# 300분(5시간)이나 여유를 두는 이유: GitHub Actions는 혼잡한 시간대에
# 예약 실행이 몇 시간씩 늦게 트리거되는 경우가 실제로 있어서(2026-08-04에
# 마감+1시간41분 지연으로 그날 놓친 사례 확인됨), 너무 빡빡하게 잡으면
# 그날 리포트를 통째로 놓칠 수 있음.
#
# EDT(서머타임) 기준 마감 = 20:00 UTC, EST 기준 마감 = 21:00 UTC
# -> 20:00 UTC부터 자정 넘어 다음날 01:58 UTC까지 커버해서 두 계절 다 +
# 5시간 지연 여유까지 포함 (자정을 넘어가서 요일 두 개로 나눠 등록 -
# intraday_monitor.yml과 같은 방식).
on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 20-23 * * 1-5'
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 0-1 * * 2-6'
  workflow_dispatch:
    inputs:
      test:
        description: '테스트 모드 (시간대/중복전송/상태 전부 무시하고 지금 조건 충족 신호 강제 전송, 저장 안 함)'
        type: boolean
        default: false

permissions:
  contents: write   # 상태파일/히스토리 커밋을 위해 필요

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 스크리너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py ${{ github.event.inputs.test == 'true' && '--test' || '' }}

      - name: 상태파일/히스토리/중복방지마커 저장소에 반영
        if: ${{ github.event.inputs.test != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in daily_state.json alert_history.json eod_sent.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "chore: update daily state/history/sent-marker [skip ci]"
          git push
