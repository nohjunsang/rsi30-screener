name: EOD Signal Report

# 미국 정규장 마감(16:00 ET) 이후 자동 실행.
# UTC 21:15 = EDT(서머타임) 기준 마감 1시간15분 후, EST 기준 마감 15분 후
# -> 두 경우 다 커버되도록 여유 잡음. (한국시간으로는 다음날 06:15 전후)
on:
  schedule:
    - cron: '15 21 * * 1-5'   # 평일(월~금, UTC 기준) 21:15
  workflow_dispatch:

permissions:
  contents: write   # 상태파일/히스토리 커밋을 위해 필요

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 스크리너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: 상태파일/히스토리 저장소에 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in daily_state.json alert_history.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "chore: update daily state/history [skip ci]"
          git push
