name: Intraday 4H Signal Monitor

# 미국 정규장 시간(09:30~16:00 ET)을 UTC로 환산해 여유있게 커버.
# EDT(서머타임) 기준 13:30~20:00 UTC, EST 기준 14:30~21:00 UTC
# -> 13:00~21:45 UTC 범위로 잡아서 두 경우 다 포함되도록 함.
# (실제 장중인지 최종 판단은 intraday_monitor.py 내부의 zoneinfo 체크가
#  다시 한 번 정확하게 걸러줌)
#
# 4시간봉 기준이라 15분보다 여유있게 30분 간격으로 체크.
on:
  schedule:
    - cron: '*/30 13-21 * * 1-5'   # 평일 13:00~21:45 UTC, 30분 간격
  workflow_dispatch:
    inputs:
      test:
        description: '테스트 모드 (장시간+상태 무시, 지금 조건 충족 신호 강제 전송, 저장 안 함)'
        type: boolean
        default: false

permissions:
  contents: write   # 상태파일/히스토리 커밋을 위해 필요

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 4H 모니터링 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python intraday_monitor.py ${{ github.event.inputs.test == 'true' && '--test' || '' }}

      - name: 상태파일/히스토리 저장소에 반영
        if: ${{ github.event.inputs.test != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in h4_state.json alert_history.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "chore: update h4 state/history [skip ci]"
          git push
